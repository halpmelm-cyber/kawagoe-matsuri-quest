<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071018"><title>川越まつりクエスト V7</title><link rel="stylesheet" href="styles.css"></head>
<body><div id="game">
<div class="hud panel"><div class="avatar"><div class="pxman"></div></div><div><b>まつり</b><div>Lv. <span id="lv">1</span></div><div class="expbar"><i id="expbar"></i></div><small>EXP <span id="xp">0</span>/100</small></div><div class="hudRight"><span>🎟 祭り札　<b id="money">0</b>枚</span><span>📖 図鑑　<b id="bookCount">0</b>/7</span><span>📜 クエスト　<b id="questCount">0</b>/5</span></div></div>
<div class="mapTitle panel">川越まつりのまち</div>
<div class="mini panel"><div class="miniMap"><i id="dot"></i></div></div>
<div class="quest panel"><b>⭕ メインクエスト</b><span id="questText">まちを歩いて、人に話しかけよう</span></div>

<div id="world">
<div class="water"></div><div class="bridge br1"></div><div class="bridge br2"></div>
<div class="path ph"></div><div class="path pv"></div><div class="path ptop"></div>
<div class="house house1"><i></i><b>蔵</b></div><div class="house house2"><i></i><b>町家</b></div><div class="house house3"><i></i><b>菓子屋</b></div><div class="house house4"><i></i><b>町家</b></div>
<div class="gate">⛩<b>氷川神社</b></div>
<div class="clock">▥<b>時の鐘</b></div>
<div class="tree t1">♣</div><div class="tree t2">♣</div><div class="tree t3">♣</div><div class="tree t4">♣</div><div class="tree t5">♣</div>
<div class="floatLabel l1">蔵のまちなみ</div><div class="floatLabel l2">菓子屋横丁</div>
<div class="dashi d1 photoDashi" data-spot="rokken"><div class="rokkenSprite" aria-label="六軒町 三番叟の山車"></div><b>六軒町の山車<br>（三番叟）</b></div>
<div class="dashi d2" data-spot="imafuku"><div class="figure">♚</div><div class="roof">◆</div><div class="stage">🥁</div><b>今福囃子連中</b></div>
<div class="npc npc1" data-npc="rokken"><div class="person red"></div><b>六軒町の関係者</b></div>
<div class="npc npc2" data-npc="hayashi"><div class="person blue"></div></div>
<div class="npc npc3" data-npc="kid"><div class="person pink"></div></div>
<div id="player"><div class="person player"></div><em>!</em></div>
</div>

<div id="dialog" class="panel dialog hidden"><div class="portrait"><div class="bigface"></div></div><div class="speech"><b id="speaker">六軒町の関係者</b><p id="speech">ようこそ 川越まつりへ！</p></div><div class="choices"><button id="yes">はい（クイズに挑戦する）</button><button id="no">いいえ（またあとで）</button></div></div>

<div class="dpad"><button data-m="up">▲</button><button data-m="left">◀</button><button data-m="right">▶</button><button data-m="down">▼</button></div>
<button id="A">A</button>
<nav class="panel"><button data-tab="bag">💰<span>もちもの</span></button><button data-tab="book">📖<span>図鑑</span></button><button data-tab="quests">📜<span>クエスト</span></button><button data-tab="settings">⚙<span>せってい</span></button><button id="saveBtn">💾<span>セーブ</span></button><button data-tab="gacha">🎁<span>ガチャ</span></button></nav>
</div>

<div id="overlay" class="hidden"><div class="window panel"><button id="x">×</button><div id="windowBody"></div></div></div>
<div id="toast"></div><script src="data.js"></script><script src="app.js"></script></body></html>
